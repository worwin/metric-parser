[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metric-parser"
version = "0.1.0"
description = "Canonical financial metric computation and artifact/query layer on top of edgar-parser outputs."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Joshua" }
]
dependencies = [
  "duckdb>=1.5.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
